name: Build HEXA Android APK & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web dependencies & build bundle
        run: |
          npm install
          npm run build

      - name: Sync built web assets to Android assets
        run: |
          rm -rf android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug & Signed Release APKs
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon
          keytool -genkeypair -v -keystore hexa-release.keystore -alias hexa -keyalg RSA -keysize 2048 -validity 10000 -storepass hexapass123 -keypass hexapass123 -dname "CN=HEXA, OU=PersonalIntelligence, O=HEXA, L=Local, S=NA, C=US"
          gradle assembleRelease -Pandroid.injected.signing.store.file="$(pwd)/hexa-release.keystore" -Pandroid.injected.signing.store.password=hexapass123 -Pandroid.injected.signing.key.alias=hexa -Pandroid.injected.signing.key.password=hexapass123 --no-daemon

      - name: Prepare Release APK Artifacts
        run: |
          mkdir -p release-apks
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apks/HEXA-v1.0.${{ github.run_number }}-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk release-apks/HEXA-v1.0.${{ github.run_number }}-release.apk

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hexa-apks
          path: release-apks/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: HEXA v1.0.${{ github.run_number }}
          body: |
            Automated Android APK build for **HEXA — Personal Intelligence System**.
            - `HEXA-v1.0.${{ github.run_number }}-release.apk` (Signed Release APK)
            - `HEXA-v1.0.${{ github.run_number }}-debug.apk` (Debug APK)
          files: |
            release-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
